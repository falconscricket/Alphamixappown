plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alpha.wag'
    compileSdk 34

    defaultConfig {
        applicationId "com.alpha.wag"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress 'mp3'
    }
}

dependencies {
    // Firefox's engine (GeckoView). "latest.release" = newest published build.
    implementation 'org.mozilla.geckoview:geckoview:latest.release'
}
